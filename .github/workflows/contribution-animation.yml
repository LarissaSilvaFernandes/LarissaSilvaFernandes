name: Generate Dark Dragon Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Dark Dragon contribution animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: LarissaSilvaFernandes
          outputs: |
            dist/dark-dragon.svg?color_snake=#8B0000&color_dots=#1a1a2e,#4a0e0e,#8B0000,#B22222,#DAA520
            dist/dark-dragon-dark.svg?palette=github-dark&color_snake=#DAA520&color_dots=#0d1117,#4a0e0e,#8B0000,#B22222,#DAA520
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
